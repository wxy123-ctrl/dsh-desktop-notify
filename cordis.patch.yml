# dsh-desktop-notify 的 bundle 补丁：向 Loader 插入一行宿主插件。
# 安装目标：desktop profile（~/.dsh/profiles/desktop）。本插件仅在 DSH
# 桌面端（Electron 渲染器，dsh-app://app）生效——client.js 有桌面守卫，
# 误装入其他 profile 也全程 no-op。
# 行 config 可在 profile 的 cordis.patch.yml 按 id: desktop-notify 覆盖
# （如 prefsPath 指定静音偏好文件位置）。
- insert:
    - id: desktop-notify
      name: dsh-desktop-notify
